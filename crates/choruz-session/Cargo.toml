[package]
name = "choruz-session"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Session Manager: session registry, command state machine, lease/epoch, retry, dead letter, executor registry"

[features]
default = ["postgres"]
postgres = ["dep:deadpool", "dep:deadpool-postgres", "dep:tokio", "dep:tokio-postgres", "dep:tracing", "dep:uuid"]

[[test]]
name = "integration"
required-features = ["postgres"]

[dependencies]
chrono.workspace = true
deadpool = { workspace = true, optional = true }
deadpool-postgres = { workspace = true, optional = true }
choruz-ids = { path = "../choruz-ids" }
choruz-events = { path = "../choruz-events" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }
tokio-postgres = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
