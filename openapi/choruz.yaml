openapi: 3.1.0
info:
  title: Choruz API
  version: 0.1.0
  description: >
    Implementation route inventory for the local Choruz API Gateway. Routes
    classified under x-choruz-route-classes.humanOperatorInternal or
    x-choruz-route-classes.operationalInternal are documented so the console and
    operator tooling contract is visible; they are not ordinary third-party API
    integration endpoints.
servers:
  - url: http://localhost:3000
x-choruz-route-classes:
  humanOperatorInternal:
    description: >
      Human-only routes gated by require_human_operator. These surfaces are
      intended for the local console, runtime operation, and local tooling.
    operations:
      - PATCH /v1/principals/{principalId}/workspace
      - POST /v1/agents/batch-disable
      - GET /v1/agents/{agentId}/tasks
      - GET /v1/agents/{agentId}/cron
      - POST /v1/agents/{agentId}/cron
      - PATCH /v1/agents/{agentId}/cron/{jobId}
      - DELETE /v1/agents/{agentId}/cron/{jobId}
      - GET /v1/runtime/bindings
      - POST /v1/runtime/bindings
      - GET /v1/runtime/bindings/{bindingId}
      - POST /v1/runtime/bindings/{bindingId}/rebind
      - GET /v1/runtime/policies/{conversationId}
      - PUT /v1/runtime/policies/{conversationId}
      - GET /v1/conversations/{conversationId}/runtime-status
      - PATCH /v1/conversations/{conversationId}/workspace
      - POST /v1/companies/{companyId}/reset-sessions
      - GET /v1/filesystem/list
      - GET /v1/filesystem/stat
      - GET /v1/filesystem/home
      - GET /v1/filesystem/read
      - POST /v1/filesystem/write
      - GET /v1/ssh/hosts
      - POST /v1/ssh/tunnel
      - GET /v1/ssh/tunnels
      - DELETE /v1/ssh/tunnel/{id}
      - POST /v1/ssh/connect-choruz
  operationalInternal:
    description: >
      Local service health, telemetry, console, and terminal-control surfaces.
      These routes support the deployed Choruz application and are not presented
      as stable third-party integration APIs.
    operations:
      - GET /healthz
      - GET /readyz
      - GET /metrics
      - GET /v1/status
      - GET /v1/bootstrap
      - GET /v1/console
      - POST /v1/webhooks/flush
      - POST /v1/telemetry
      - GET /v1/ws/terminals/{bindingId}
      - POST /v1/terminals/{bindingId}/ensure
      - POST /v1/terminals/{bindingId}/input
paths:
  /v1/online/groups:
    get:
      summary: List this Online account's shared groups and invitations
      responses:
        '200': {description: 'Actor-scoped group links with message_count, latest_seq and a last_message preview (content limited to 200 characters, created_at); no encryption keys'}
  /v1/online/groups/invite:
    post:
      summary: Invite one Online account to an owned group
      description: Returns a single-use invitation containing an endpoint-only encryption key. Never log or send the invitation to telemetry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [conversation_id]
              properties:
                conversation_id: {type: string}
      responses:
        '200': {description: Invitation and expiry}
        '403': {description: Only the group owner can invite}
  /v1/online/groups/join:
    post:
      summary: Accept an Online group invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [invitation]
              properties:
                invitation: {type: string, writeOnly: true, maxLength: 4096}
      responses:
        '200': {description: Group pending owner acknowledgement}
        '400': {description: Invitation invalid, expired or consumed}
  /v1/online/groups/{link_id}:
    parameters:
      - in: path
        name: link_id
        required: true
        schema: {type: string}
    delete:
      summary: Leave a joined group or revoke an owned invitation
      responses:
        '204': {description: Local access disabled and cloud link revoked}
  /v1/online/groups/{link_id}/agents:
    get:
      summary: List this user's eligible Agents and their membership in an Online guest group
      responses:
        '200':
          description: Agents with id, name, status and safe error; the link must belong to the signed-in human
    post:
      summary: Request membership for an existing Agent owned by the guest device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id]
              additionalProperties: false
              properties:
                agent_id: { type: string }
      responses:
        '202':
          description: Membership is pending until the group owner accepts the encrypted registration
  /v1/online/groups/{link_id}/agents/{agent_id}:
    delete:
      summary: Stop sharing this user's Agent and queue removal on the owner device
      responses:
        '204':
          description: Local execution stopped; remote membership removal queued durably
  /v1/online/groups/{link_id}/messages:
    parameters:
      - in: path
        name: link_id
        required: true
        schema: {type: string}
    get:
      summary: Read shared group messages after a stable sequence cursor
      parameters:
        - in: query
          name: after_seq
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        '200': {description: 'Up to 100 messages in ascending sequence. Shared author context contains display-only owner_name, device_name, account_name and harness strings, never account credentials or runtime paths.'}
    post:
      summary: Queue a guest message for the owner's existing group pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, content]
              properties:
                id: {type: string, format: uuid}
                content: {type: string, minLength: 1, maxLength: 32000}
      responses:
        '202': {description: Durably queued; delivery is asynchronous}
        '409': {description: Group inactive or message ID already used}
  /v1/online/session:
    get:
      summary: Read the current human's Online account without exposing its credential
      description: State is signed_out, signed_in or reauth_required. Signed-in responses include account_id, device_id, display_name and a separate mailbox connection status, never the cloud session token. Network failure returns 500 rather than claiming the account is online.
      responses:
        '200':
          description: Signed-in account or signed-out state
        '429':
          description: Account verification throttled; the local identity is retained
          headers:
            Retry-After: {schema: {type: integer}, description: Seconds until another attempt}
    delete:
      summary: Revoke the Online session and disconnect this local identity
      responses:
        '204':
          description: Session revoked and local identity removed
  /v1/online/sign-in:
    post:
      summary: Sign the current local human into the Online account service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: {type: string, format: email, maxLength: 254}
                password: {type: string, writeOnly: true, maxLength: 128}
      responses:
        '200':
          description: Account connected to this local identity
        '400': {description: Credentials rejected}
        '401': {description: Local authentication required}
        '403': {description: Human operator required}
        '409': {description: Sign out before changing accounts}
        '429':
          description: Account service rate limit; retry after the advertised delay
          headers:
            Retry-After: {schema: {type: integer}, description: Seconds until another attempt}
        '500': {description: Account service or local storage unavailable}
  /v1/online/sign-up:
    post:
      summary: Register an Online account and connect the current local human
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password, name]
              properties:
                email: {type: string, format: email, maxLength: 254}
                password: {type: string, writeOnly: true, minLength: 12, maxLength: 128}
                name: {type: string, minLength: 1, maxLength: 80}
      responses:
        '200':
          description: Account registered and connected
        '400': {description: Registration rejected}
        '401': {description: Local authentication required}
        '403': {description: Human operator required}
        '409': {description: Sign out before changing accounts}
        '429':
          description: Account service rate limit; retry after the advertised delay
          headers:
            Retry-After: {schema: {type: integer}, description: Seconds until another attempt}
        '500': {description: Account service or local storage unavailable}
  /v1/activity:
    get:
      summary: Read the signed-in human's activity records
      description: Requires since and until RFC3339 timestamps spanning at most 31 days. source is telemetry (default) or audit. limit is 1–500 (default 100). Optional cursor is opaque; trace_id filters a trace. Returns records and next_cursor. Scope comes only from authentication. Message content is not included.
      responses:
        '200': {description: Activity page}
        '400': {description: Invalid range or cursor}
        '401': {description: Authentication required}
        '403': {description: Human operator required}
  /v1/activity/summary:
    get:
      summary: Aggregate the signed-in human's activity
      description: Same source, since, until and trace_id filters as activity reads. Returns per-name counts, explicit failed outcomes and mean recorded duration; truncated is true if more than 200 groups exist. Counts are events, not unique users or inferred satisfaction. Pagination parameters are not accepted.
      responses:
        '200': {description: Activity summary}
        '400': {description: Invalid filters}
        '401': {description: Authentication required}
        '403': {description: Human operator required}
  /v1/activity/prune:
    post:
      summary: Preview or delete the signed-in human's old telemetry
      description: JSON body requires before (RFC3339, at least 24 hours old); apply defaults to false. Operates on at most 1000 rows per call and returns count and has_more. Explicit apply deletes only this actor's telemetry and records the deletion in the same transaction. Audit logs and conversations are never deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [before]
              properties:
                before: {type: string, format: date-time}
                apply: {type: boolean, default: false}
      responses:
        '200': {description: Preview or applied batch}
        '400': {description: Invalid cutoff}
        '401': {description: Authentication required}
        '403': {description: Human operator required}
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Process is alive and serving HTTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostServiceStatus"
  /readyz:
    get:
      operationId: readinessCheck
      responses:
        "200":
          description: Service dependencies are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostServiceStatus"
        "503":
          description: Service is alive but not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostServiceStatus"
  /metrics:
    get:
      operationId: metricsSnapshot
      responses:
        "200":
          description: Prometheus metrics
  /v1/status:
    get:
      operationId: phaseStatus
      responses:
        "200":
          description: Product phase status
  /v1/auth/local/login:
    post:
      operationId: localLogin
      responses:
        "200":
          description: Local user session created
  /v1/auth/local/signup:
    post:
      operationId: localSignup
      responses:
        "201":
          description: Local account created
  /v1/me:
    get:
      operationId: getCurrentPrincipal
      responses:
        "200":
          description: Current authenticated principal
  /v1/console:
    get:
      operationId: fetchConsoleSnapshot
      responses:
        "200":
          description: Console snapshot
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  pinned_conversations:
                    type: array
                    items:
                      $ref: "#/components/schemas/PinnedConversation"
                  archived_conversations:
                    type: array
                    items:
                      $ref: "#/components/schemas/ArchivedConversation"
  /v1/bootstrap:
    get:
      operationId: fetchDashboardBootstrap
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: after
          schema:
            type: string
          description: Opaque cursor returned by the preceding page
      responses:
        "200":
          description: Bounded, activity-ordered dashboard bootstrap page
          content:
            application/json:
              schema:
                type: object
                required: [principal, companies, agents, conversations, sync_cursor, snapshot_at]
                additionalProperties: true
                properties:
                  conversations:
                    type: object
                    required: [items, has_more]
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
                      next_cursor:
                        oneOf:
                          - type: string
                          - type: "null"
                      has_more:
                        type: boolean
                  sync_cursor:
                    type: integer
                    format: int64
                    minimum: 0
                    description: >-
                      Durable change-feed high-water captured before the snapshot.
                      Replay /v1/sync after this cursor; duplicate state is possible,
                      missed concurrent mutations are not.
        "400":
          description: Invalid pagination cursor
        "401":
          description: Authentication required
  /v1/sync:
    get:
      operationId: listSyncChanges
      description: >-
        Non-destructive, principal-scoped dashboard gap-fill feed. Each client
        persists its own cursor; reading this endpoint never acknowledges or
        hides events from another client.
      parameters:
        - in: query
          name: cursor
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Oldest-unseen-first page of durable dashboard changes
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [changes, next_cursor, head_cursor, has_more]
                properties:
                  changes:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [cursor, event_type, entity_type, entity_id, payload, created_at]
                      properties:
                        cursor:
                          type: integer
                          format: int64
                        event_type:
                          type: string
                        entity_type:
                          type: string
                        entity_id:
                          type: string
                        conversation_id:
                          oneOf:
                            - type: string
                            - type: "null"
                        payload:
                          type: object
                          additionalProperties: true
                        created_at:
                          type: string
                          format: date-time
                  next_cursor:
                    type: integer
                    format: int64
                  head_cursor:
                    type: integer
                    format: int64
                  has_more:
                    type: boolean
        "400":
          description: Invalid cursor
        "401":
          description: Authentication required
  /v1/ws/sync:
    get:
      operationId: connectDashboardSync
      description: >-
        Upgrade to the authenticated dashboard WebSocket. Server frames replay
        durable changes oldest-first; clients persist progress by sending
        {"type":"sync_ack","cursor":N}. Delivery alone never advances the
        per-device acknowledgement.
      parameters:
        - in: query
          name: device_id
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - in: query
          name: cursor
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
      responses:
        "101":
          description: WebSocket upgrade accepted
        "400":
          description: Invalid device or cursor
        "401":
          description: Authentication required
        "500":
          description: Durable wakeup listener unavailable
  /v1/runtime/bindings:
    get:
      operationId: listRuntimeBindings
      responses:
        "200":
          description: Runtime binding list
    post:
      operationId: createRuntimeBinding
      responses:
        "201":
          description: Runtime binding created
  /v1/runtime/bindings/{bindingId}:
    parameters:
      - name: bindingId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getRuntimeBinding
      responses:
        "200":
          description: Runtime binding details
  /v1/runtime/bindings/{bindingId}/rebind:
    parameters:
      - name: bindingId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: rebindRuntimeBinding
      responses:
        "200":
          description: Runtime binding rebound
  /v1/runtime/policies/{conversationId}:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getRuntimePolicy
      responses:
        "200":
          description: Runtime policy details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimePolicy"
    put:
      operationId: upsertRuntimePolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertRuntimePolicyRequest"
      responses:
        "200":
          description: Runtime policy upserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimePolicy"
  /v1/principals/{principalId}/disable:
    post:
      operationId: disablePrincipal
      parameters:
        - name: principalId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Principal disabled
  /v1/principals/{principalId}/workspace:
    patch:
      operationId: migratePrincipalWorkspace
      parameters:
        - name: principalId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Principal workspace migrated
  /v1/agents:
    post:
      operationId: createAgent
      responses:
        "201":
          description: Agent created
  /v1/agents/batch-disable:
    post:
      operationId: batchDisableAgents
      responses:
        "200":
          description: Agents disabled
  /v1/agents/{agentId}/rotate-secret:
    post:
      operationId: rotateAgentSecret
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Secret rotated
  /v1/agents/{agentId}/tasks:
    get:
      operationId: getAgentTasks
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Agent task list
  /v1/agents/{agentId}/cron:
    parameters:
      - name: agentId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listAgentCronJobs
      responses:
        "200":
          description: Agent cron job list
    post:
      operationId: createAgentCronJob
      responses:
        "200":
          description: Agent cron job created
        "400":
          description: Invalid schedule expression, timezone, interval, or one-shot timestamp
  /v1/agents/{agentId}/cron/{jobId}:
    parameters:
      - name: agentId
        in: path
        required: true
        schema:
          type: string
      - name: jobId
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateAgentCronJob
      responses:
        "200":
          description: Agent cron job updated
        "400":
          description: Invalid schedule expression, timezone, interval, or one-shot timestamp
    delete:
      operationId: deleteAgentCronJob
      responses:
        "200":
          description: Agent cron job deleted
  /v1/conversations:
    get:
      operationId: listConversations
      responses:
        "200":
          description: Conversation list
  /v1/conversations/direct:
    post:
      operationId: createDirectConversation
      responses:
        "201":
          description: Direct conversation created or reused
  /v1/conversations/{conversationId}/pin:
    put:
      operationId: pinConversation
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Conversation pinned for the authenticated user
        "403":
          description: Principal cannot pin this conversation
    delete:
      operationId: unpinConversation
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Conversation unpinned for the authenticated user
        "403":
          description: Agent principals cannot unpin conversations
  /v1/conversations/{conversationId}/archive:
    put:
      operationId: archiveConversation
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Conversation archived for the authenticated user
        "403":
          description: Principal cannot archive this conversation
    delete:
      operationId: unarchiveConversation
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Conversation restored for the authenticated user
        "403":
          description: Agent principals cannot restore conversations
  /v1/conversations/{conversationId}/workspace:
    patch:
      operationId: migrateConversationWorkspace
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Conversation workspace migrated
  /v1/conversations/{conversationId}/interactions:
    get:
      operationId: listInteractions
      description: Human-operator read of committed message records and their execution outcomes. Active conversation membership is required. Content is omitted unless include_content=true; raw terminal keystrokes and tool payloads are not returned. Newest sequence first, with an exclusive before_seq cursor.
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string }
        - name: before_seq
          in: query
          schema: { type: integer, minimum: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: include_content
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Records and next_before_seq. Each record identifies its event, sender role, trace, and execution attempts without duplicating the underlying message store. The read is audited.
        "400":
          description: Invalid pagination
        "401":
          description: Authentication required
        "403":
          description: Human operator with conversation membership required
  /v1/conversations/{conversationId}/messages:
    get:
      operationId: listMessages
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Message list
  /v1/conversations/{conversationId}/message-page:
    get:
      operationId: listMessagePage
      description: Keyset-paginated message history. before_seq and after_seq are mutually exclusive.
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
        - name: principal_id
          in: query
          required: true
          schema:
            type: string
        - name: before_seq
          in: query
          schema:
            type: integer
            minimum: 0
        - name: after_seq
          in: query
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Chronologically ordered page and cursor for the requested direction
          content:
            application/json:
              schema:
                type: object
                required: [messages, direction, has_more]
                additionalProperties: false
                properties:
                  messages:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  direction:
                    type: string
                    enum: [latest, before, after]
                  has_more:
                    type: boolean
                  next_cursor:
                    oneOf:
                      - type: integer
                      - type: "null"
        "400":
          description: Invalid or ambiguous cursor
        "403":
          description: Conversation is not visible to the caller
  /v1/conversations/{conversationId}/tasks:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listChannelTasks
      responses:
        "200":
          description: Redacted channel task list for a task-enabled conversation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChannelTask"
        "403":
          description: Channel tasks disabled or caller is not a conversation member
    post:
      operationId: createChannelTask
      description: Internal/group-agent command creation endpoint. Human empty-form create is not available in MVP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChannelTaskRequest"
      responses:
        "201":
          description: Agent-created channel task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelTask"
        "200":
          description: Existing agent-created task returned for the same idempotency key and payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelTask"
        "400":
          description: Invalid title, task key, idempotency key, status, or assignee
        "403":
          description: Channel tasks disabled or caller is not authorized
        "409":
          description: Task key conflict or idempotency key reused with a different payload
  /v1/conversations/{conversationId}/tasks/from-message:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: createChannelTaskFromMessage
