                  items:
                    type: object
                    required: [name, command]
                    properties:
                      name:
                        type: string
                        description: The Maildir file name the helper assigned (`cmd-<seq>-<id>.json`)
                      command:
                        type: object
                        description: The command JSON as the agent wrote it
                      files:
                        type: array
                        description: Bytes of a `share_file` target, relative to the workspace, at most 8 MiB each
                        items:
                          type: object
                          required: [path, content]
                          properties:
                            path:
                              type: string
                            content:
                              type: string
                              format: byte
      responses:
        "204":
          description: Commands stored for the outbox watcher
        "400":
          description: Too many commands, a file over the cap, a path outside the workspace, or content that is not base64
        "401":
          description: Missing or revoked host token
        "403":
          description: The binding is not placed on this host
  /v1/runtime-hosts/{hostId}/commands/{commandId}/attachments/{attachmentId}:
    parameters:
      - name: hostId
        in: path
        required: true
        schema:
          type: string
      - name: commandId
        in: path
        required: true
        schema:
          type: string
      - name: attachmentId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: downloadCommandAttachment
      summary: The bytes of a file attached to a turn the host has claimed, staged into the workspace inbox before the turn runs
      security:
        - RuntimeHostToken: []
      responses:
        "200":
          description: Attachment bytes with their content type
        "401":
          description: Missing or revoked host token
        "403":
          description: The command is not placed on this host, does not name the attachment, or the agent may not read it
        "404":
          description: Unknown command or attachment
  /v1/runtime-hosts/{hostId}/harness-account-logins/claim:
    parameters:
      - name: hostId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: claimHarnessAccountLogin
      responses:
        "200":
          description: Claimed login or null
  /v1/runtime-hosts/{hostId}/harness-account-logins/{loginId}/callback/claim:
    parameters:
      - name: hostId
        in: path
        required: true
        schema:
          type: string
      - name: loginId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: claimHarnessAccountLoginCallback
      responses:
        "200":
          description: Claimed authorization code or null
  /v1/runtime-hosts/{hostId}/harness-account-logins/{loginId}/complete:
    parameters:
      - name: hostId
        in: path
        required: true
        schema:
          type: string
      - name: loginId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: completeHarnessAccountLogin
      responses:
        "200":
          description: Login verified
  /v1/runtime-hosts/{hostId}/harness-account-logins/{loginId}/fail:
    parameters:
      - name: hostId
        in: path
        required: true
        schema:
          type: string
      - name: loginId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: failHarnessAccountLogin
      responses:
        "200":
          description: Login failed
  /v1/runtime-hosts/{hostId}/harness-account-logins/{loginId}/publish:
    parameters:
      - name: hostId
        in: path
        required: true
        schema:
          type: string
      - name: loginId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: publishHarnessAccountLogin
      responses:
        "200":
          description: Authorization link published
  /v1/runtime-hosts/{hostId}/harness-accounts:
    parameters:
      - name: hostId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: registerHarnessAccount
      responses:
        "200":
          description: Harness account registered
  /v1/runtime-hosts/{hostId}/harness-accounts/{accountId}/verify:
    parameters:
      - name: hostId
        in: path
        required: true
        schema:
          type: string
      - name: accountId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: verifyHarnessAccount
      responses:
        "200":
          description: Harness account verified
  /v1/runtime-hosts/{hostId}/heartbeat:
    parameters:
      - name: hostId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: heartbeatRuntimeHost
      responses:
        "200":
          description: Runtime host heartbeat recorded
  /v1/runtime-hosts/{hostId}/operations:
    parameters:
      - name: hostId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: executeRuntimeHostOperation
      description: Runs a device-owned operation. drivers.inspect without driver_type reports installed harnesses; with driver_type it reads that device's default-profile model catalog.
      responses:
        "200":
          description: Result returned by the selected runtime host
  /v1/runtime/bindings/{bindingId}/host:
    parameters:
      - name: bindingId
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: assignBindingHost
      responses:
        "200":
          description: Binding host assigned
  /v1/runtime/bindings/{bindingId}/experience:
    parameters:
      - name: bindingId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getExperienceLearning
      description: Returns the human owner's learning settings and recent revisions for an authorized Agent. Source traces are not returned by this endpoint.
      responses:
        "200":
          description: Settings and revision history
    patch:
      operationId: selectExperienceRevision
      description: Selects a previously reviewed revision for future tasks, or clears the active revision. Fences any in-flight learning result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision_id]
              properties:
                revision_id:
                  type: [string, "null"]
      responses:
        "200":
          description: Updated learning settings
    put:
      operationId: configureExperienceLearning
      description: Enables or disables asynchronous experience learning with a separately selected analysis Agent in the same workspace. Changes fence pending analysis; foreground execution never waits for learning.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled, analyst_binding_id]
              properties:
                enabled:
                  type: boolean
                analyst_binding_id:
                  type: string
                optimization_settings:
                  type: [object, 'null']
                  additionalProperties: false
                  required: [suite, config, auto_apply]
                  description: Opt-in fixed-suite background optimization of each newly reviewed candidate. The suite is user supplied, never inferred from research success claims. Auto-apply requires validation improvement, held-out non-regression and final content review. Null uses content-review learning without measured search.
                  properties:
                    suite:
                      $ref: '#/paths/~1v1~1runtime~1bindings~1{bindingId}~1experience~1evaluations/post/requestBody/content/application~1json/schema/properties/suite'
                    config:
                      $ref: '#/paths/~1v1~1runtime~1bindings~1{bindingId}~1experience~1evaluations/post/requestBody/content/application~1json/schema/properties/optimization'
                    auto_apply:
                      type: boolean
      responses:
        "200":
          description: Saved settings and revision history
  /v1/runtime/bindings/{bindingId}/experience/evaluations:
    parameters:
      - name: bindingId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: listExperienceEvaluations
      description: Returns the owner's twenty most recent comparison summaries, reserved call counts and application status. Supply id for one full run with frozen snapshots, ancestry and per-case results. Only an opted-in automatic run can apply its reviewed winner. Results do not establish performance outside this tool-free task suite.
      parameters:
        - name: id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Evaluation history
    post:
      operationId: createExperienceEvaluation
      description: Queues an asynchronous comparison of a reviewed candidate against the current guidance on the target account. Freezes the supplied suite and both revisions. Each task runs in a fresh tool-free scratch conversation, never the live session. Each candidate/case uses one final executor call plus one call per internal team member. An interrupted call is not retried. Settings or execution-context changes cancel the run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision_id, suite]
              properties:
                revision_id:
                  type: string
                optimization:
                  type: object
                  additionalProperties: false
                  required: [max_metric_calls, max_proposals, minibatch_size, seed, merge]
                  properties:
                    max_metric_calls:
                      type: integer
                      minimum: 1
                      maximum: 512
                    max_proposals:
                      type: integer
                      minimum: 1
                      maximum: 32
                    minibatch_size:
                      type: integer
                      minimum: 1
                    seed:
                      type: integer
                      minimum: 0
                    merge:
                      type: boolean
                    cache_evaluations:
                      type: boolean
                      default: false
                      description: Reuse previous candidate/case observations; otherwise measure each comparison afresh.
                    evolve_team:
                      type: boolean
                      default: false
                      description: Allow bounded internal team changes after a documented recurring problem; analysis standards remain fixed.
                    max_agents:
                      type: integer
                      minimum: 1
                      maximum: 4
                      default: 4
                      description: Maximum total agents per task, including the final executor; all use the target's existing device and account.
                suite:
                  type: object
                  additionalProperties: false
                  required: [name, cases]
                  properties:
                    name:
                      type: string
                      maxLength: 120
                    cases:
                      type: array
                      minItems: 3
                      maxItems: 64
                      items:
                        type: object
                        additionalProperties: false
                        required: [id, split, input, check]
                        properties:
                          id:
                            type: string
                            maxLength: 80
                          split:
                            type: string
                            enum: [train, validation, test]
                          input:
                            type: string
                            maxLength: 16000
                          check:
                            oneOf:
                              - type: object
                                additionalProperties: false
                                required: [type, expected]
                                properties:
                                  type:
                                    const: exact
                                  expected:
                                    type: string
                              - type: object
                                additionalProperties: false
                                required: [type, expected]
                                properties:
                                  type:
                                    const: json
                                  expected: {}
      responses:
        "202":
          description: Immutable comparison queued
        "409":
          description: An evaluation is already pending or the candidate is not eligible
  /v1/companies/{companyId}/computer-use:
    parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: manageComputerUse
      description: Checks device browser and desktop tools. An optional tool and enabled boolean persist automatic skill provisioning and start missing tool installation on the selected runtime_host_id, or the local device when omitted. Installation continues independently of the browser request. Only human company members may use this operation. Disabling does not uninstall tools or revoke operating-system permissions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                runtime_host_id:
                  type: string
                tool:
                  type: string
                  enum: [browser, desktop]
                enabled:
                  type: boolean
      responses:
        "200":
          description: Device-local tool installation and health state
  /v1/workspace-sessions/import:
    post:
      operationId: importWorkspaceSessions
      description: Imports verified sessions from the selected device and company account stores. Each selection may carry harness_account_id for an isolated profile; the server rescans that owned profile before binding it. The owner of a deleted company may reclaim its idle session after the previous terminal stops; the previous Agent and binding are disabled and their history retained.
      responses:
        "200":
          description: Workspace sessions imported
        "409":
          description: Session belongs to another active company or owner, has an in-flight turn, or its previous terminal has not stopped
  /v1/workspace-sessions/scan:
    post:
      operationId: scanWorkspaceSessions
      description: Scans the device default stores and the selected company's isolated account stores on that device. Results carry harness_account_id for isolated profiles, preserving profile identity through import and resume.
      responses:
        "200":
          description: Workspace session scan result
components:
  securitySchemes:
    RuntimeHostToken:
      type: apiKey
      in: header
      name: x-choruz-host-token
      description: The token a runtime host received when its pairing code was redeemed
  schemas:
    HostServiceStatus:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - protocol_version
      properties:
        status:
          type: string
          enum: [ok, ready, not_ready]
        service:
          type: string
        protocol_version:
          type: integer
          format: int32
          minimum: 1
        database:
          type: boolean
    ConversationRuntimeStatus:
      type: object
      required:
        - conversation_id
        - agent_principal_id
        - agent_name
        - status
        - queued_count
        - active_command
        - last_error
      properties:
        conversation_id:
          type: string
        agent_principal_id:
          type: string
        agent_name:
          type: string
        status:
          type: string
          enum:
            - idle
            - queued
            - busy
        queued_count:
          type: integer
          minimum: 0
        active_command:
          oneOf:
            - $ref: "#/components/schemas/RuntimeStatusCommand"
            - type: "null"
        last_error:
          type:
            - string
            - "null"
    RuntimeStatusCommand:
      type: object
      required:
        - command_id
        - message_id
        - turn_id
        - status
        - created_at
        - updated_at
        - lease_age_seconds
        - attempt_count
        - last_error
      properties:
        command_id:
          type: string
        message_id:
          type: string
        turn_id:
          type: string
        status:
          type: string
          enum:
            - pending
            - leased
            - started
            - heartbeating
            - succeeded
            - committed
            - retry_scheduled
            - dead_letter
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        lease_age_seconds:
          type:
            - integer
            - "null"
          minimum: 0
        attempt_count:
          type: integer
          minimum: 0
        last_error:
          type:
            - string
            - "null"
    RuntimePolicy:
      type: object
      required:
        - conversation_id
        - auto_mode
        - max_auto_turns
        - max_workflow_turns
        - require_human_after_n_turns
        - allow_agent_to_agent
        - allow_file_write
        - default_reviewer_agent_id
        - default_coordinator_agent_id
        - untagged_human_mode
      properties:
        conversation_id:
          type: string
        auto_mode:
          type: string
          enum:
            - disabled
            - mentioned_only
            - metadata_only
        max_auto_turns:
          type: integer
        max_workflow_turns:
          type: integer
        require_human_after_n_turns:
          type: integer
        allow_agent_to_agent:
          type: boolean
        allow_file_write:
          type: boolean
        default_reviewer_agent_id:
          type:
            - string
            - "null"
        default_coordinator_agent_id:
          type:
            - string
            - "null"
        untagged_human_mode:
          type: string
          enum:
            - mentioned_only
            - coordinator_only
            - all_agents
    UpsertRuntimePolicyRequest:
      type: object
      additionalProperties: false
      properties:
        auto_mode:
          type: string
          enum:
            - disabled
            - mentioned_only
            - metadata_only
        max_auto_turns:
          type: integer
        max_workflow_turns:
          type: integer
        require_human_after_n_turns:
          type: integer
        allow_agent_to_agent:
          type: boolean
        allow_file_write:
          type: boolean
        default_reviewer_agent_id:
          type: string
        default_coordinator_agent_id:
          type: string
        untagged_human_mode:
          type: string
          enum:
            - mentioned_only
            - coordinator_only
            - all_agents
    PinnedConversation:
      type: object
      required:
        - conversation_id
        - pinned_at
      properties:
        conversation_id:
          type: string
        pinned_at:
          type: string
          format: date-time
    ArchivedConversation:
      type: object
      required:
        - conversation_id
        - archived_at
      properties:
        conversation_id:
          type: string
        archived_at:
          type: string
          format: date-time
    ChannelTaskStatus:
      type: string
      enum:
        - todo
        - in_progress
        - blocked
        - in_review
        - done
    ChannelTaskSourceKind:
      type: string
      enum:
        - agent
        - message
    PrincipalType:
      type: string
      enum:
        - human
        - agent
    ChannelTask:
      type: object
      additionalProperties: false
      required:
        - task_id
        - conversation_id
        - task_key
        - title
        - status
        - source_kind
        - version
        - created_at
        - updated_at
      properties:
        task_id:
          type: string
        conversation_id:
          type: string
        task_key:
          type: string
        title:
          type: string
        status:
          $ref: "#/components/schemas/ChannelTaskStatus"
        assignee_principal_id:
          type: string
        assignee_type:
          $ref: "#/components/schemas/PrincipalType"
        assignee_name:
          type: string
        blocked_reason:
          type: string
        context_label:
          type: string
        source_kind:
          $ref: "#/components/schemas/ChannelTaskSourceKind"
        source_message_id:
          type: string
        created_by:
          type: string
        created_by_type:
          $ref: "#/components/schemas/PrincipalType"
        updated_by:
          type: string
        updated_by_type:
          $ref: "#/components/schemas/PrincipalType"
        version:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ChannelTaskVisibleValues:
      type: object
      additionalProperties: false
      properties:
        status:
          $ref: "#/components/schemas/ChannelTaskStatus"
        assignee_principal_id:
          type: string
        blocked_reason:
          oneOf:
            - type: string
            - type: "null"
        context_label:
          oneOf:
            - type: string
            - type: "null"
        source_kind:
          $ref: "#/components/schemas/ChannelTaskSourceKind"
        source_message_id:
          type: string
    ChannelTaskEvent:
      type: object
      additionalProperties: false
      required:
        - event_id
        - task_id
        - kind
        - created_at
      properties:
        event_id:
          type: string
        task_id:
          type: string
        kind:
          type: string
        actor_principal_id:
          type: string
        actor_type:
          $ref: "#/components/schemas/PrincipalType"
        created_at:
          type: string
          format: date-time
        resulting_version:
          type: integer
          format: int64
        previous:
          $ref: "#/components/schemas/ChannelTaskVisibleValues"
        new:
          $ref: "#/components/schemas/ChannelTaskVisibleValues"
        workflow_kind:
          type: string
        status_effect:
          $ref: "#/components/schemas/ChannelTaskStatus"
        reason_code:
          type: string
    ChannelTaskDetail:
      type: object
      additionalProperties: false
      required:
        - task
        - events
      properties:
        task:
          $ref: "#/components/schemas/ChannelTask"
        events:
          type: array
          description: Recent redacted task history, ordered oldest-to-newest within the returned window.
          maxItems: 50
          items:
            $ref: "#/components/schemas/ChannelTaskEvent"
    CreateChannelTaskRequest:
      type: object
      additionalProperties: false
      required:
        - title
        - idempotency_key
      properties:
        task_key:
          type: string
          description: >-
            Optional. When omitted the server allocates a sequential
            `TASK-{N}` key scoped to the conversation. Callers may still
            pass an explicit key for backwards compatibility.
        title:
          type: string
        assignee_principal_id:
          type: string
        status:
          $ref: "#/components/schemas/ChannelTaskStatus"
        context_label:
          type: string
        idempotency_key:
          type: string
    CreateChannelTaskFromMessageRequest:
      type: object
      additionalProperties: false
      required:
        - message_id
        - title
        - assignee_principal_id
      properties:
        message_id:
          type: string
        title:
          type: string
        assignee_principal_id:
          type: string
        context_label:
          oneOf:
            - type: string
            - type: "null"
        idempotency_key:
          type: string
    PatchChannelTaskRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        status:
          $ref: "#/components/schemas/ChannelTaskStatus"
        assignee_principal_id:
          type: string
        blocked_reason:
          oneOf:
            - type: string
            - type: "null"
        context_label:
          oneOf:
            - type: string
            - type: "null"
