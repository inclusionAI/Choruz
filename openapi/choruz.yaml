components:
  schemas:
    HostServiceStatus:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - protocol_version
      properties:
        status:
          type: string
          enum: [ok, ready, not_ready]
        service:
          type: string
        protocol_version:
          type: integer
          format: int32
          minimum: 1
        database:
          type: boolean
    ConversationRuntimeStatus:
      type: object
      required:
        - conversation_id
        - agent_principal_id
        - agent_name
        - status
        - queued_count
        - active_command
        - last_error
      properties:
        conversation_id:
          type: string
        agent_principal_id:
          type: string
        agent_name:
          type: string
        status:
          type: string
          enum:
            - idle
            - queued
            - busy
        queued_count:
          type: integer
          minimum: 0
        active_command:
          oneOf:
            - $ref: "#/components/schemas/RuntimeStatusCommand"
            - type: "null"
        last_error:
          type:
            - string
            - "null"
    RuntimeStatusCommand:
      type: object
      required:
        - command_id
        - message_id
        - turn_id
        - status
        - created_at
        - updated_at
        - lease_age_seconds
        - attempt_count
        - last_error
      properties:
        command_id:
          type: string
        message_id:
          type: string
        turn_id:
          type: string
        status:
          type: string
          enum:
            - pending
            - leased
            - started
            - heartbeating
            - succeeded
            - committed
            - retry_scheduled
            - dead_letter
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        lease_age_seconds:
          type:
            - integer
            - "null"
          minimum: 0
        attempt_count:
          type: integer
          minimum: 0
        last_error:
          type:
            - string
            - "null"
    RuntimePolicy:
      type: object
      required:
        - conversation_id
        - auto_mode
        - max_auto_turns
        - max_workflow_turns
        - require_human_after_n_turns
        - allow_agent_to_agent
        - allow_file_write
        - default_reviewer_agent_id
        - default_coordinator_agent_id
        - untagged_human_mode
      properties:
        conversation_id:
          type: string
        auto_mode:
          type: string
          enum:
            - disabled
            - mentioned_only
            - metadata_only
        max_auto_turns:
          type: integer
        max_workflow_turns:
          type: integer
        require_human_after_n_turns:
          type: integer
        allow_agent_to_agent:
          type: boolean
        allow_file_write:
          type: boolean
        default_reviewer_agent_id:
          type:
            - string
            - "null"
        default_coordinator_agent_id:
          type:
            - string
            - "null"
        untagged_human_mode:
          type: string
          enum:
            - mentioned_only
            - coordinator_only
            - all_agents
    UpsertRuntimePolicyRequest:
      type: object
      additionalProperties: false
      properties:
        auto_mode:
          type: string
          enum:
            - disabled
            - mentioned_only
            - metadata_only
        max_auto_turns:
          type: integer
        max_workflow_turns:
          type: integer
        require_human_after_n_turns:
          type: integer
        allow_agent_to_agent:
          type: boolean
        allow_file_write:
          type: boolean
        default_reviewer_agent_id:
          type: string
        default_coordinator_agent_id:
          type: string
        untagged_human_mode:
          type: string
          enum:
            - mentioned_only
            - coordinator_only
            - all_agents
    PinnedConversation:
      type: object
      required:
        - conversation_id
        - pinned_at
      properties:
        conversation_id:
          type: string
        pinned_at:
          type: string
          format: date-time
    ArchivedConversation:
      type: object
      required:
        - conversation_id
        - archived_at
      properties:
        conversation_id:
          type: string
        archived_at:
          type: string
          format: date-time
    ChannelTaskStatus:
      type: string
      enum:
        - todo
        - in_progress
        - blocked
        - in_review
        - done
    ChannelTaskSourceKind:
      type: string
      enum:
        - agent
        - message
    PrincipalType:
      type: string
      enum:
        - human
        - agent
    ChannelTask:
      type: object
      additionalProperties: false
      required:
        - task_id
        - conversation_id
        - task_key
        - title
        - status
        - source_kind
        - version
        - created_at
        - updated_at
      properties:
        task_id:
          type: string
        conversation_id:
          type: string
        task_key:
          type: string
        title:
          type: string
        status:
          $ref: "#/components/schemas/ChannelTaskStatus"
        assignee_principal_id:
          type: string
        assignee_type:
          $ref: "#/components/schemas/PrincipalType"
        assignee_name:
          type: string
        blocked_reason:
          type: string
        context_label:
          type: string
        source_kind:
          $ref: "#/components/schemas/ChannelTaskSourceKind"
        source_message_id:
          type: string
        created_by:
          type: string
        created_by_type:
          $ref: "#/components/schemas/PrincipalType"
        updated_by:
          type: string
        updated_by_type:
          $ref: "#/components/schemas/PrincipalType"
        version:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ChannelTaskVisibleValues:
      type: object
      additionalProperties: false
      properties:
        status:
          $ref: "#/components/schemas/ChannelTaskStatus"
        assignee_principal_id:
          type: string
        blocked_reason:
          oneOf:
            - type: string
            - type: "null"
        context_label:
          oneOf:
            - type: string
            - type: "null"
        source_kind:
          $ref: "#/components/schemas/ChannelTaskSourceKind"
        source_message_id:
          type: string
    ChannelTaskEvent:
      type: object
      additionalProperties: false
      required:
        - event_id
        - task_id
        - kind
        - created_at
      properties:
        event_id:
          type: string
        task_id:
          type: string
        kind:
          type: string
        actor_principal_id:
          type: string
        actor_type:
          $ref: "#/components/schemas/PrincipalType"
        created_at:
          type: string
          format: date-time
        resulting_version:
          type: integer
          format: int64
        previous:
          $ref: "#/components/schemas/ChannelTaskVisibleValues"
        new:
          $ref: "#/components/schemas/ChannelTaskVisibleValues"
        workflow_kind:
          type: string
        status_effect:
          $ref: "#/components/schemas/ChannelTaskStatus"
        reason_code:
          type: string
    ChannelTaskDetail:
      type: object
      additionalProperties: false
      required:
        - task
        - events
      properties:
        task:
          $ref: "#/components/schemas/ChannelTask"
        events:
          type: array
          description: Recent redacted task history, ordered oldest-to-newest within the returned window.
          maxItems: 50
          items:
            $ref: "#/components/schemas/ChannelTaskEvent"
    CreateChannelTaskRequest:
      type: object
      additionalProperties: false
      required:
        - title
        - idempotency_key
      properties:
        task_key:
          type: string
          description: >-
            Optional. When omitted the server allocates a sequential
            `TASK-{N}` key scoped to the conversation. Callers may still
            pass an explicit key for backwards compatibility.
        title:
          type: string
        assignee_principal_id:
          type: string
        status:
          $ref: "#/components/schemas/ChannelTaskStatus"
        context_label:
          type: string
        idempotency_key:
          type: string
    CreateChannelTaskFromMessageRequest:
      type: object
      additionalProperties: false
      required:
        - message_id
        - title
        - assignee_principal_id
      properties:
        message_id:
          type: string
        title:
          type: string
        assignee_principal_id:
          type: string
        context_label:
          oneOf:
            - type: string
            - type: "null"
        idempotency_key:
          type: string
    PatchChannelTaskRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        status:
          $ref: "#/components/schemas/ChannelTaskStatus"
        assignee_principal_id:
          type: string
        blocked_reason:
          oneOf:
            - type: string
            - type: "null"
        context_label:
          oneOf:
            - type: string
            - type: "null"
