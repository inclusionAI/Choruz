  /v1/telemetry:
    post:
      operationId: ingestTelemetry
      description: Authenticated activity batches, at most 100 events. Each event carries eventId, schemaVersion (1), traceId, spanId, sessionId, name, ts (RFC3339), optional durationMs and sanitized data. Workspace and actor are derived from authentication. The whole batch commits before acknowledgement; replayed event IDs do not create duplicate rows.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    required: [eventId, schemaVersion, traceId, spanId, sessionId, name, ts]
                    properties:
                      eventId: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.:-]+$'}
                      schemaVersion: {type: integer, enum: [1]}
                      traceId: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.:-]+$'}
                      spanId: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.:-]+$'}
                      sessionId: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.:-]+$'}
                      name: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.:-]+$'}
                      ts: {type: string, format: date-time}
                      durationMs: {type: integer, minimum: 0}
                      data: {type: object, description: Sanitized properties up to 16384 serialized bytes}
      responses:
        "204":
          description: Entire batch durably committed or already present
        "400":
          description: Invalid batch; no events committed
        "422":
          description: Event fields do not match the wire schema; no events committed
        "401":
          description: Authentication required
        "500":
          description: Persistence failed; retry the same event IDs
