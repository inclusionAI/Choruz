[graph]
targets = []
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # `serial` 0.4 (via portable-pty) has no maintained successor yet. Keep the
  # ignore explicit so future security reports do not get hidden.
  "RUSTSEC-2017-0008", # serial
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "PostgreSQL",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
